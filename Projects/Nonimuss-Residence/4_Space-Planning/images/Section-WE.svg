<svg viewBox="0 0 660 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Nonimuss west-east section through the wellness spine</title>
<desc>Section from forest (west) to street (east): forest wall, double-height pool hall with the office box floating over its west end and a void, the two-storey link with stair and bridge, and the single-storey step-free house. Winter and morning sun annotated.</desc>
<rect x="0" y="0" width="660" height="440" fill="#f4f6f8"/>
<rect x="0" y="349" width="660" height="91" fill="#efe9dc"/>
<text x="24" y="26" font-size="14.5" fill="#1c1a17" font-weight="bold">SECTION W–E through the wellness spine (1 m = 20 px)</text>
<text x="40" y="46" font-size="10.5" fill="#5f7a3f" font-weight="bold">◄ W  forest / reservoir</text>
<text x="620" y="46" font-size="10.5" fill="#7a5b1e" font-weight="bold" text-anchor="end">street  E ►</text>
<line x1="90" y1="173" x2="520" y2="173" stroke="#b06a4a" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="516" y="168" font-size="8.4" fill="#a05636" text-anchor="end">8.6 m rear-height cap — office top 7.5 m ✓ (OQ-17)</text>
<g fill="#8aa77f" stroke="#5f7a55" stroke-width="1">
<path d="M40 349 L40 120 Q46 95 52 120 L52 349 Z"/>
<ellipse cx="46" cy="118" rx="20" ry="34"/>
<ellipse cx="70" cy="150" rx="18" ry="30"/>
</g>
<text x="56" y="300" font-size="8" fill="#3f5237" transform="rotate(-90 56 300)">forest wall ~15–20 m</text>
<line x1="24" y1="349" x2="636" y2="349" stroke="#8a8064" stroke-width="2"/>
<rect x="98" y="255" width="118" height="94" fill="#9cc4dd" fill-opacity="0.65" stroke="#4f7d99" stroke-width="1.8"/>
<rect x="103" y="330" width="108" height="16" fill="#7fb0d0" fill-opacity="0.8"/>
<text x="157" y="300" font-size="9" fill="#20323d" text-anchor="middle">Pool hall</text>
<text x="157" y="313" font-size="7.6" fill="#33505f" text-anchor="middle">double-height</text>
<rect x="98" y="195" width="60" height="60" fill="#f2f0ea" stroke="#8a8168" stroke-width="1.8"/>
<text x="128" y="220" font-size="8.4" fill="#3a352a" text-anchor="middle" font-weight="bold">Office</text>
<text x="128" y="232" font-size="7" fill="#6b6459" text-anchor="middle">+4.5 m</text>
<line x1="98" y1="238" x2="80" y2="238" stroke="#4f7d99" stroke-width="1.6"/>
<polygon points="80,235 80,241 73,238" fill="#4f7d99"/>
<text x="86" y="250" font-size="6.8" fill="#4f7d99" text-anchor="middle">W outlook</text>
<text x="187" y="222" font-size="7.4" fill="#6b6459" text-anchor="middle">open</text>
<text x="187" y="232" font-size="7.4" fill="#6b6459" text-anchor="middle">to below</text>
<path d="M187 236 v10 M183 242 l4 4 l4 -4" fill="none" stroke="#9a927c" stroke-width="1.2"/>
<rect x="158" y="240" width="58" height="9" fill="#d8c8ea" stroke="#8163a3" stroke-width="1"/>
<text x="187" y="247.5" font-size="6.2" fill="#4a3560" text-anchor="middle">bridge</text>
<rect x="216" y="195" width="42" height="154" fill="#c9b4de" fill-opacity="0.75" stroke="#8163a3" stroke-width="1.8"/>
<line x1="216" y1="255" x2="258" y2="255" stroke="#8163a3" stroke-width="1.2"/>
<path d="M221 300 h8 v-9 h8 v-9 h8 v-9 h9" fill="none" stroke="#5c4080" stroke-width="1.3"/>
<text x="237" y="325" font-size="7.6" fill="#37244a" text-anchor="middle">Link</text>
<text x="237" y="336" font-size="6.6" fill="#4a3560" text-anchor="middle">wet ↓ / stair ↑</text>
<rect x="258" y="265" width="230" height="84" fill="#dcc6ab" fill-opacity="0.5" stroke="#3a352a" stroke-width="2"/>
<rect x="330" y="250" width="64" height="15" fill="#eaf2f6" stroke="#7d95a1" stroke-width="1.2"/>
<text x="362" y="246" font-size="7" fill="#5c6f79" text-anchor="middle">clerestory (high-S)</text>
<text x="300" y="312" font-size="9" fill="#3a2f16">Great room</text>
<text x="300" y="325" font-size="7.4" fill="#6b6459">opens W → link/pool</text>
<text x="452" y="312" font-size="8" fill="#6b6459" text-anchor="end">bedrooms /</text>
<text x="452" y="323" font-size="8" fill="#6b6459" text-anchor="end">service beyond</text>
<line x1="480" y1="265" x2="480" y2="349" stroke="#8a8272" stroke-width="1"/>
<text x="484" y="310" font-size="7.6" fill="#6b6459">4.0 m</text>
<circle cx="612" cy="96" r="9" fill="#e7b24f"/>
<line x1="604" y1="104" x2="430" y2="262" stroke="#e0a83f" stroke-width="1.8" stroke-dasharray="5 4"/>
<polygon points="433,255 424,264 439,266" fill="#e0a83f"/>
<text x="560" y="120" font-size="8.2" fill="#9a7320">E morning sun →</text>
<line x1="360" y1="180" x2="360" y2="250" stroke="#c9a441" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="366" y="200" font-size="7.8" fill="#9a7320">winter noon 15.6°</text>
<text x="366" y="211" font-size="7.4" fill="#a89468">caught high-S / clerestory</text>
<text x="96" y="150" font-size="7.4" fill="#5f7a55">forest blocks low W / evening sun →</text>
<text x="96" y="161" font-size="7.4" fill="#5f7a55">pool lit from roof (L5)</text>
<line x1="98" y1="366" x2="488" y2="366" stroke="#4c9a5a" stroke-width="1.4"/>
<line x1="98" y1="362" x2="98" y2="370" stroke="#4c9a5a" stroke-width="1.4"/>
<line x1="488" y1="362" x2="488" y2="370" stroke="#4c9a5a" stroke-width="1.4"/>
<text x="293" y="380" font-size="8.4" fill="#367a44" text-anchor="middle" font-weight="bold">continuous step-free ground — 0 steps pool→link→house (D5)</text>
</svg>
